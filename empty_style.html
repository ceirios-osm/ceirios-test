<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Empty Style</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="module">
      import {Map} from 'https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.mjs';
      const map = new Map({
         container: 'map',
         style: {
  "version": 8,
  "name": "Empty Style",
  "metadata": {"maputnik:renderer": "mlgljs"},
  "sources": {
    "openmaptiles": {
      "type": "vector",
      "url": "https://api.maptiler.com/tiles/v3-openmaptiles/tiles.json?key=get_your_own_OpIi9ZULNHzrESv6T2vL"
    }
  },
  "sprite": "",
  "glyphs": "https://orangemug.github.io/font-glyphs/glyphs/{fontstack}/{range}.pbf",
  "layers": [
    {
      "id": "background",
      "type": "background",
      "paint": {"background-color": "rgba(242, 239, 233, 1)"}
    },
    {
      "id": "water",
      "type": "fill",
      "source": "openmaptiles",
      "source-layer": "water",
      "paint": {"fill-color": "rgba(170, 211, 223, 1)"}
    },
    {
      "id": "place-continent",
      "type": "symbol",
      "source": "openmaptiles",
      "source-layer": "place",
      "filter": ["all", ["==", "$type", "Point"], ["==", "class", "continent"]],
      "layout": {
        "text-field": [
          "coalesce",
          ["get", "name:cy"],
          ["get", "name:en"],
          ["get", "name"]
        ],
        "text-font": ["Noto Sans Regular"],
        "text-allow-overlap": true
      }
    },
    {
      "id": "place-country",
      "type": "symbol",
      "source": "openmaptiles",
      "source-layer": "place",
      "filter": ["all", ["==", "$type", "Point"], ["==", "class", "country"]],
      "layout": {
        "text-field": [
          "coalesce",
          ["get", "name:cy"],
          ["get", "name:en"],
          ["get", "name"]
        ],
        "text-font": ["Noto Sans Regular"],
        "text-allow-overlap": true
      }
    },
    {
      "id": "place-city",
      "type": "symbol",
      "source": "openmaptiles",
      "source-layer": "place",
      "filter": ["all", ["==", "$type", "Point"], ["==", "class", "city"]],
      "layout": {
        "text-field": [
          "coalesce",
          ["get", "name:cy"],
          ["get", "name:en"],
          ["get", "name"]
        ],
        "text-font": ["Noto Sans Regular"],
        "text-allow-overlap": true
      }
    },
    {
      "id": "place-town",
      "type": "symbol",
      "source": "openmaptiles",
      "source-layer": "place",
      "filter": ["all", ["==", "$type", "Point"], ["==", "class", "town"]],
      "layout": {
        "text-field": [
          "coalesce",
          ["get", "name:cy"],
          ["get", "name:en"],
          ["get", "name"]
        ],
        "text-font": ["Noto Sans Regular"],
        "text-allow-overlap": true
      }
    },
    {
      "id": "place-village",
      "type": "symbol",
      "source": "openmaptiles",
      "source-layer": "place",
      "filter": ["all", ["==", "$type", "Point"], ["==", "class", "village"]],
      "layout": {
        "text-field": [
          "coalesce",
          ["get", "name:cy"],
          ["get", "name:en"],
          ["get", "name"]
        ],
        "text-font": ["Noto Sans Regular"],
        "text-allow-overlap": true,
        "text-ignore-placement": false
      }
    },
    {
      "id": "place-hamlet",
      "type": "symbol",
      "source": "openmaptiles",
      "source-layer": "place",
      "filter": ["all", ["==", "$type", "Point"], ["==", "class", "hamlet"]],
      "layout": {
        "text-field": [
          "coalesce",
          ["get", "name:cy"],
          ["get", "name:en"],
          ["get", "name"]
        ],
        "text-font": ["Noto Sans Regular"],
        "text-allow-overlap": true,
        "text-ignore-placement": false
      }
    },
    {
      "id": "place-suburb",
      "type": "symbol",
      "source": "openmaptiles",
      "source-layer": "place",
      "filter": ["all", ["==", "$type", "Point"], ["==", "class", "suburb"]],
      "layout": {
        "text-field": [
          "coalesce",
          ["get", "name:cy"],
          ["get", "name:en"],
          ["get", "name"]
        ],
        "text-font": ["Noto Sans Regular"],
        "text-allow-overlap": true,
        "text-ignore-placement": false
      }
    }
  ],
  "id": "k6c79om"
},
      });
      map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
